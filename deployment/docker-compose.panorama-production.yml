services:
  frontend:
    image: ${PANORAMA_FRONTEND_IMAGE:?Set the current production frontend image ID}
    volumes:
      - ${PANORAMA_RELEASE:?}/frontend:/usr/share/nginx/html:ro
      - ${PANORAMA_RELEASE:?}/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
  backend:
    image: ${PANORAMA_BACKEND_IMAGE:?Set the current production backend image ID}
    command: ["gunicorn", "main:app", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:5555", "--timeout", "2100"]
    volumes:
      - ${PANORAMA_RELEASE:?}/backend/controllers/model.py:/backend/controllers/model.py:ro
      - ${PANORAMA_RELEASE:?}/backend/schemas/generation.py:/backend/schemas/generation.py:ro
      - ${PANORAMA_RELEASE:?}/backend/utils/panorama.py:/backend/utils/panorama.py:ro
    deploy:
      resources:
        limits:
          memory: "4g"
  comfyui:
    image: ${PANORAMA_COMFYUI_IMAGE:?Set the current production ComfyUI image ID}
    command: ["python", "main.py", "--listen", "0.0.0.0", "--lowvram", "--cpu-vae", "--extra-model-paths-config", "/ainterior-panorama-paths.yml"]
    volumes:
      - ${PANORAMA_RELEASE:?}/custom_nodes/ainterior_panorama:/comfyui/custom_nodes/ainterior_panorama:ro
      - ${PANORAMA_RELEASE:?}/models:/ainterior-panorama-models:ro
      - ${PANORAMA_RELEASE:?}/comfy-production-paths.yml:/ainterior-panorama-paths.yml:ro