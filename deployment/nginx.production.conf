limit_req_zone $binary_remote_addr zone=ainterior_auth:10m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location / {
        try_files $uri /index.html;
    }
    location ^~ /api/internal/ {
        return 404;
    }
    location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }
    location ^~ /api/auth/ {
        limit_req zone=ainterior_auth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://backend:5555/auth/;
        proxy_set_header Host $host;
    }
    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://backend:5555/;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 2100s;
    }
}