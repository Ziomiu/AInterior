server {
    listen 127.0.0.1:5175;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        client_max_body_size 24m;
        proxy_pass http://127.0.0.1:5557/;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}