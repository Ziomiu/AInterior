# Standalone during development. To integrate with the main AInterior stack,
# add these two services into its docker-compose.yml on the same network — this
# file doesn't assume it owns the compose setup (see README §Integration).

services:
  furniture-replace:
    build: .
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8000}:8000"
    volumes:
      - ./data:/srv/data          # model weights + results + catalog images persist here
      - ./frontend:/srv/frontend  # edit the console without rebuilding
    environment:
      - DEVICE=${DEVICE:-cuda}
      - QDRANT_URL=http://qdrant:6333
      - DATA_DIR=/srv/data
      - SAM2_MODEL=${SAM2_MODEL:-facebook/sam2.1-hiera-large}
      - IP_ADAPTER_WEIGHT=${IP_ADAPTER_WEIGHT:-ip-adapter_sd15.bin}
      - PROMPT_INPAINT_MODEL=${PROMPT_INPAINT_MODEL:-}
      - PROMPT_CLEAN_FIRST=${PROMPT_CLEAN_FIRST:-false}
      - INPAINT_CROP_PADDING=${INPAINT_CROP_PADDING:-0}
      - MODEL_IDLE_OFFLOAD_SECONDS=${MODEL_IDLE_OFFLOAD_SECONDS:-30}
      - SERVICE_API_KEY=${SERVICE_API_KEY:-}
      # - SERVICE_API_KEY=change-me
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"   # REST/dashboard — helpful during development
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
