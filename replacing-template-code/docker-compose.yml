# Standalone during development. To integrate with the main AInterior stack,
# either add these two services into its docker-compose.yml on the same
# network, or keep this file and connect via an external Docker network —
# both work, this file doesn't assume it owns the compose setup (see README §4).

services:
  furniture-replace:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data          # model weights + results + catalog images persist here
      - ./frontend:/srv/frontend
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"   # REST/dashboard — helpful during development
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
